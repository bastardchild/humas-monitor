# docker-compose.yml
services:
  app:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/data/app.db
      - LITESTREAM_REPLICA_URL=${LITESTREAM_REPLICA_URL:-}
      - LITESTREAM_S3_ENDPOINT=${LITESTREAM_S3_ENDPOINT:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - sqlite-data:/data

volumes:
  sqlite-data: