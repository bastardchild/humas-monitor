# docker-compose.yml
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      # Gunakan nama service "backend", BUKAN "localhost"
      - BACKEND_URL=http://backend:8000/api/v1
    depends_on:
      - backend