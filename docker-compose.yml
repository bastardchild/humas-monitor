version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: unmer_monitor_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: unmer_monitor_frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
