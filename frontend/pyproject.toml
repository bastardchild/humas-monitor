[project]
name = "humas-monitor-frontend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.42.0",
  "plotly>=5.18.0",
  "pandas>=2.2.0",
  "python-dotenv>=1.0.0",
  "Authlib>=1.3.0",
  "httpx>=0.27.0",
  "requests>=2.31.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["app.py"]

[tool.hatch.build.targets.wheel]
packages = []
artifacts = ["app.py"]
