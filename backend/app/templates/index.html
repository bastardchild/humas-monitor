{% extends "base.html" %}

{% block content %}
<div x-data="{ sidebarOpen: false }" class="flex h-screen overflow-hidden relative">
    <!-- MOBILE OVERLAY -->
    <div x-show="sidebarOpen" @click="sidebarOpen = false" x-transition.opacity class="fixed inset-0 bg-black/60 z-30 lg:hidden"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar flex flex-col p-4 overflow-y-auto shrink-0 z-40
                  fixed inset-y-0 left-0 w-72 transform transition-transform duration-200 ease-in-out
                  lg:static lg:translate-x-0 lg:w-80"
           :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'">
        <div class="flex items-center justify-between mb-6">
            <img src="https://unmer.ac.id/wp-content/uploads/2020/07/Branding_Putih-300x118.png" alt="UNMER Logo" class="h-8 lg:h-10">
            <button @click="sidebarOpen = false" class="lg:hidden text-[#a8c0b0] hover:text-white">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>

        <div class="mb-4 pb-4 border-b border-emerald-900/40">
            <div class="text-sm font-semibold flex items-center gap-1.5">
                <span class="material-symbols-outlined text-lg">person</span>
                <span>Administrator</span>
            </div>
            <div class="text-xs text-[#a8c0b0] mt-0.5">UNMER Monitor System</div>
        </div>

        <h2 class="text-lg font-bold font-tech text-[#b8ffcc] mb-1">UNMER Monitor</h2>
        <p class="text-xs text-[#a8c0b0] mb-4">Analisis Sentimen & Public Perception</p>

        <!-- PIPELINE CONTROL EXPANDER (Alpine.js) -->
        <div class="mb-5 border border-emerald-900/60 rounded-lg bg-[#111e16] overflow-hidden">
            <button @click="pipelineOpen = !pipelineOpen" class="w-full p-3 flex items-center justify-between text-xs font-semibold text-[#b8ffcc] hover:bg-emerald-950/40">
                <span class="flex items-center gap-1.5">
                    <span class="material-symbols-outlined text-base">settings</span> Pipeline Control
                </span>
                <span class="material-symbols-outlined text-sm" x-text="pipelineOpen ? 'expand_less' : 'expand_more'">expand_more</span>
            </button>
            <div x-show="pipelineOpen" x-transition class="p-3 border-t border-emerald-900/40 text-xs bg-[#0d1410]">
                <p class="text-[#a8c0b0] mb-3">Jalankan seluruh proses crawling & analisis data dari awal secara otomatis.</p>
                <div id="pipeline-trigger-area">
                    <button
                        hx-post="/partials/pipeline/run"
                        hx-target="#pipeline-trigger-area"
                        hx-swap="innerHTML"
                        class="w-full btn-custom py-2 px-3 text-xs flex items-center justify-center gap-1.5"
                    >
                        <span class="material-symbols-outlined text-base">rocket_launch</span> Jalankan Pipeline
                    </button>
                </div>
            </div>
        </div>

        <!-- FILTER FORM (HTMX AUTO-TRIGGER) -->
        <form id="filter-form" hx-get="/partials/dashboard-content" hx-target="#dashboard-content" hx-trigger="change, keyup delay:300ms from:#search_query" class="space-y-4 flex-1">
            <!-- Platform Filter -->
            <div>
                <label class="block text-xs font-semibold text-[#b8ffcc] mb-1 flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">smartphone</span> Platform
                </label>
                <div class="space-y-1.5 text-xs text-[#e6f0e8]">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" name="platforms" value="Instagram" checked class="accent-emerald-500 rounded"> Instagram
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" name="platforms" value="TikTok" checked class="accent-emerald-500 rounded"> TikTok
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" name="platforms" value="Google Review" checked class="accent-emerald-500 rounded"> Google Review
                    </label>
                </div>
            </div>

            <!-- Date Range Filter -->
            <div>
                <label class="block text-xs font-semibold text-[#b8ffcc] mb-1 flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">calendar_today</span> Rentang Waktu
                </label>
                <select name="date_range" class="w-full custom-input text-xs">
                    <option value="Last 24 Hours">Last 24 Hours</option>
                    <option value="Last 3 Days">Last 3 Days</option>
                    <option value="Last 7 Days" selected>Last 7 Days</option>
                    <option value="Last 30 Days">Last 30 Days</option>
                    <option value="Last 90 Days">Last 90 Days</option>
                    <option value="All Time">All Time</option>
                </select>
            </div>

            <!-- Sentiment Filter -->
            <div>
                <label class="block text-xs font-semibold text-[#b8ffcc] mb-1 flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">label</span> Filter Sentimen
                </label>
                <div class="space-y-1.5 text-xs text-[#e6f0e8]">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" name="sentiments" value="positive" checked class="accent-emerald-500 rounded"> Positive
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" name="sentiments" value="neutral" checked class="accent-emerald-500 rounded"> Neutral
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" name="sentiments" value="negative" checked class="accent-emerald-500 rounded"> Negative
                    </label>
                </div>
            </div>

            <!-- Search Keyword Input -->
            <div>
                <label class="block text-xs font-semibold text-[#b8ffcc] mb-1 flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">search</span> Cari Kata Kunci
                </label>
                <input type="text" id="search_query" name="query" placeholder="Kata kunci caption / ulasan..." class="w-full custom-input text-xs">
            </div>

            <!-- Refresh Button -->
            <div class="pt-2">
                <button type="button"
                    hx-get="/partials/dashboard-content"
                    hx-include="#filter-form"
                    hx-target="#dashboard-content"
                    class="w-full btn-custom py-2 text-xs flex items-center justify-center gap-1.5"
                >
                    <span class="material-symbols-outlined text-base">sync</span> Refresh Data
                </button>
            </div>
        </form>
    </aside>

    <!-- MAIN CONTENT WRAPPER -->
    <div class="flex-1 flex flex-col min-w-0">
        <!-- MOBILE TOPBAR -->
        <header class="lg:hidden flex items-center justify-between p-4 border-b border-emerald-900/40 bg-[#0d1410] sticky top-0 z-20">
            <img src="https://unmer.ac.id/wp-content/uploads/2020/07/Branding_Putih-300x118.png" alt="UNMER Logo" class="h-7">
            <button @click="sidebarOpen = true" class="btn-custom py-1.5 px-3 flex items-center gap-1.5 text-xs">
                <span class="material-symbols-outlined text-base">menu</span> Filter & Menu
            </button>
        </header>

        <!-- MAIN DASHBOARD CONTENT AREA -->
        <main class="flex-1 overflow-y-auto p-4 sm:p-6" id="dashboard-content" hx-get="/partials/dashboard-content" hx-trigger="load" hx-include="#filter-form">
            <!-- Loading spinner placeholder -->
            <div class="flex flex-col items-center justify-center h-full text-emerald-400 gap-3">
                <span class="material-symbols-outlined animate-spin text-4xl">sync</span>
                <p class="text-sm font-tech">Memuat Data Dashboard...</p>
            </div>
        </main>
    </div>
</div>
{% endblock %}
