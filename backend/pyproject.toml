[project]
name = "humas-monitor-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.111.0",
  "uvicorn==0.30.1",
  "pydantic==2.7.4",
  "pydantic-settings==2.3.4",
  "httpx==0.27.0",
  "python-dotenv==1.0.1",
  "apify-client==1.7.1",
  "firecrawl-py==4.34.0",
  "jinja2>=3.1.2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
supabase-compat = ["supabase==2.5.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
